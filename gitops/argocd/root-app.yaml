# One-time bootstrap: apply this file manually after ArgoCD is installed
# (PHASE5.md step 5.5). Everything else reconciles from Git afterwards.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/devanshshah-tech/BulkHead.git
    targetRevision: main
    path: gitops/argocd/apps # directory containing one Application manifest per service
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
