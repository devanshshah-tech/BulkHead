name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ingestion-service
            dir: apps/ingestion-service
          - name: query-api
            dir: apps/query-api
          - name: retrieval-service
            dir: apps/retrieval-service
    steps:
      - uses: actions/checkout@v4
      - name: Python tests
        if: matrix.name != 'retrieval-service'
        working-directory: ${{ matrix.dir }}
        run: |
          pipx install uv
          uv python install 3.12
          uv sync
          uv run ruff check .
          uv run pytest -q
      - name: Go tests
        if: matrix.name == 'retrieval-service'
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/retrieval-service/go.mod
      - name: Go lint + test
        if: matrix.name == 'retrieval-service'
        working-directory: ${{ matrix.dir }}
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

  build-push:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: bulkhead-ingestion-service
            context: apps/ingestion-service
          - image: bulkhead-query-api
            context: apps/query-api
          - image: bulkhead-retrieval-service
            context: apps/retrieval-service
          - image: bulkhead-inference
            context: apps/inference
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Phase 5.1 / Tier 2: on a v* tag, package the airgap bundle and attach it
  # to a GitHub Release. Runs after build-push so the bundle embeds the
  # freshly published :latest images.
  publish-bundle:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Install zarf + uds into ./bin (package.sh expects them there)
        run: |
          mkdir -p bin
          curl -sfL -o bin/zarf https://github.com/zarf-dev/zarf/releases/download/v0.84.0/zarf_v0.84.0_Linux_amd64
          curl -sfL -o bin/uds https://github.com/defenseunicorns/uds-cli/releases/download/v0.35.1/uds-cli_v0.35.1_Linux_amd64
          chmod +x bin/zarf bin/uds

      - name: Stamp tag version into package/bundle metadata
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i "s/^  version: .*/  version: ${VER}/" infra/zarf/*/zarf.yaml
          sed -i -e "s/^  version: .*/  version: ${VER}/" -e "s/^    ref: .*/    ref: ${VER}/" infra/uds/*.yaml
          grep -H "^  version:" infra/zarf/*/zarf.yaml infra/uds/*.yaml

      - name: Build Zarf packages + UDS bundle (${{ matrix.arch }})
        run: ./hack/package.sh

      - name: Enforce GitHub Release asset cap (2GiB)
        run: |
          SIZE=$(stat -c%s build/uds-bundle-*.tar.zst)
          echo "bundle size (${{ matrix.arch }}): $SIZE bytes"
          [ "$SIZE" -le 2147483648 ] || { echo "::error::bundle exceeds GitHub's 2GiB asset cap"; exit 1; }

      - name: Publish release with bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="Airgap bundle: one-command deploy for disconnected clusters.

          \`\`\`bash
          uds deploy uds-bundle-bulkhead-rag-<arch>-${TAG}.tar.zst --confirm
          \`\`\`
          "
          until gh release view "$TAG" >/dev/null 2>&1; do
            gh release create "$TAG" --title "Bulkhead RAG ${TAG}" --notes "$NOTES" && break
            sleep 20 # lost a create race to the other matrix leg; it exists now
          done
          gh release upload "$TAG" build/uds-bundle-*.tar.zst --clobber

  # Phase 6: Docusaurus site -> GitHub Pages (project pages, /BulkHead/ base)
  deploy-docs:
    if: github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build
      - id: deployment
        uses: actions/deploy-pages@v4
