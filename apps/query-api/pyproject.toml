[project]
name = "query-api"
version = "0.1.0"
description = "Bulkhead public query API: grounded answers with citations"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "grpcio>=1.68",
    "protobuf>=5.29",
    "httpx>=0.27",
    "strawberry-graphql[fastapi]>=0.250",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "grpcio-tools>=1.68",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/query_api", "src/bulkhead"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/bulkhead"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
