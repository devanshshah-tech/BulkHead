apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: bulkhead
servers: 1
agents: 1
options:
  k3d:
    wait: true
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer
registries:
  create:
    name: bulkhead-registry
    hostPort: "5500"
