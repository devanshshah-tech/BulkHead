apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgres.name" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "postgres.name" . }}
  ports:
    - name: postgres
      port: {{ .Values.service.port }}
      targetPort: postgres
