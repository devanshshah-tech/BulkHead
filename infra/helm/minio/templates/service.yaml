apiVersion: v1
kind: Service
metadata:
  name: {{ include "minio.name" . }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "minio.name" . }}
  ports:
    - name: api
      port: {{ .Values.service.port }}
      targetPort: api
    - name: console
      port: {{ .Values.service.consolePort }}
      targetPort: console
