apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "minio.name" . }}-data
  labels:
    {{- include "minio.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.storage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
