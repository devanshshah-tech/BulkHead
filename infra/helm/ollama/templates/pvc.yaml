apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ollama.name" . }}-models
  labels:
    {{- include "ollama.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.storage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
