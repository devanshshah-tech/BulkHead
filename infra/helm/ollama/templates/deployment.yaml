apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ollama.name" . }}
  labels:
    {{- include "ollama.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ollama.name" . }}
  template:
    metadata:
      labels:
        {{- include "ollama.labels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 10001
      {{- if and .Values.models.pull.enabled (not .Values.models.baked) }}
      initContainers:
        - name: pull-models
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              /bin/ollama serve &
              SERVER_PID=$!
              for i in $(seq 1 30); do
                if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
                sleep 1
              done
              {{- range .Values.models.list }}
              /bin/ollama pull {{ . | quote }}
              {{- end }}
              kill $SERVER_PID
          volumeMounts:
            - name: models
              mountPath: /models
          env:
            - name: OLLAMA_MODELS
              value: /models
      {{- end }}
      containers:
        - name: ollama
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: OLLAMA_MODELS
              value: /models
            - name: OLLAMA_HOST
              value: 0.0.0.0
          {{- if not .Values.models.baked }}
          volumeMounts:
            - name: models
              mountPath: /models
          {{- end }}
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if not .Values.models.baked }}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "ollama.name" . }}-models
      {{- end }}
