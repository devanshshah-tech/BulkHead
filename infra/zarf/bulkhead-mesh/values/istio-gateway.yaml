# Ingress gateway for the bulkhead namespace.
global:
  hub: docker.io/istio
  tag: 1.30.3
  istioNamespace: istio-system

labels:
  istio: ingressgateway

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

service:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      targetPort: 8443
