kind: ZarfPackageConfig
metadata:
  name: bulkhead-inference
  description: Local LLM inference for Bulkhead — Ollama stripped to CPU-only with llama3.2:3b baked in
  version: 0.1.0

components:
  - name: ollama
    required: true
    images:
      - ghcr.io/devanshshah-tech/bulkhead-inference:latest
    charts:
      - name: ollama
        version: 0.1.0
        namespace: bulkhead
        localPath: ../../helm/ollama
        valuesFiles:
          - values/ollama.yaml
